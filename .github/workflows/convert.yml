name: Convert MP4 to AMV

on:
  # リポジトリにMP4ファイルがプッシュされたときに自動実行
  push:
    paths:
      - '**.mp4'
  # GitHubの画面から手動で実行したい場合も対応
  workflow_dispatch:

jobs:
  convert-video:
    runs-on: ubuntu-latest

    steps:
    # 1. リポジトリのコード（スクリプトなど）をチェックアウト
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. UbuntuサーバーにFFmpegをインストール
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 3. Python環境のセットアップ
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 4. スクリプトを実行してすべてのMP4ファイルを変換
    - name: Run conversion script
      run: |
        # リポジトリ内にあるすべてのmp4ファイルを検索して変換
        find . -name "*.mp4" | while read -r mp4_file; do
          amv_file="${mp4_file%.mp4}.amv"
          echo "Converting $mp4_file to $amv_file..."
          python convert.py "$mp4_file" "$amv_file"
        done

    # 5. 変換されたAMVファイルをGitHubからダウンロードできるように保存
    - name: Upload AMV artifact
      uses: actions/upload-artifact@v4
      with:
        name: converted-amv-videos
        path: |
          **/*.amv
        if-no-files-found: error
