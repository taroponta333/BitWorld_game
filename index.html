<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BitWorld</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="box" id="login">

<h1>🌍 BitWorld</h1>

<input id="loginUser" placeholder="ユーザー名">

<input id="loginPass"
type="password"
placeholder="パスワード">


<button onclick="login()">
ログイン
</button>


<button onclick="openRegister()">
新規登録
</button>


</div>



<div class="box hidden" id="register">


<h1>✨ BitWorld ID作成</h1>


<input id="newUser"
placeholder="ユーザー名">


<input id="newPass"
type="password"
placeholder="パスワード">


<button onclick="register()">
作成
</button>


<button onclick="backLogin()">
戻る
</button>


</div>




<div class="box hidden" id="home">


<h1>🌎 BitWorld</h1>


<div class="profile">


<div id="icon">
😀
</div>


<h2 id="nickname">
</h2>


<p id="userid"></p>


<p>
💎 <span id="coins"></span>
</p>


</div>



<h3>
アイコン変更
</h3>


<button onclick="changeIcon('😀')">
😀
</button>

<button onclick="changeIcon('🤖')">
🤖
</button>

<button onclick="changeIcon('💎')">
💎
</button>



<input id="nicknameInput"
placeholder="新しい名前">


<button onclick="changeNickname()">
ニックネーム変更
</button>



<button onclick="openShop()">
🛒 クリスタルショップ
</button>



<button onclick="logout()">
ログアウト
</button>


</div>





<div class="box hidden" id="shop">


<h1>🛒 Shop</h1>


<h3>
💎 <span id="shopCoins"></span>
</h3>


<div id="items"></div>


<button onclick="closeShop()">
戻る
</button>


</div>



<script src="script.js"></script>


</body>

</html>
