<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BitWorld</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===========================
起動画面
=========================== -->

<div id="loadingScreen" class="screen">

    <h1 class="logo">🌍 BitWorld</h1>

    <p>Loading...</p>

    <div class="loadingBar">
        <div id="loadingProgress"></div>
    </div>

</div>

<!-- ===========================
ログイン画面
=========================== -->

<div id="loginScreen" class="screen hidden">

    <h1>BitWorld</h1>

    <input
        id="loginUsername"
        type="text"
        placeholder="ユーザー名">

    <input
        id="loginPassword"
        type="password"
        placeholder="パスワード">

    <button id="loginButton">
        ログイン
    </button>

    <button id="openRegisterButton">
        新規登録
    </button>

</div>

<!-- ===========================
新規登録
=========================== -->

<div id="registerScreen"
     class="screen hidden">

    <h1>Create Account</h1>

    <input
        id="registerUsername"
        type="text"
        placeholder="ユーザー名">

    <input
        id="registerPassword"
        type="password"
        placeholder="パスワード">

    <button id="registerButton">

        アカウント作成

    </button>

    <button id="backLoginButton">

        戻る

    </button>

</div>

<!-- ===========================
ホーム
=========================== -->

<div id="homeScreen"
     class="screen hidden">

    <h1>BitWorld</h1>

    <div class="profile">

        <div id="playerIcon">

            😀
        </div>

        <h2 id="playerNickname">

            プレイヤー

        </h2>

        <p id="playerID">

            BW-000000

        </p>

        <p>

            💎

            <span id="coinText">

                100

            </span>

            Crystal Coin

        </p>

    </div>

    <button id="worldButton">

        🌍 ワールド

    </button>

    <button id="shopButton">

        🛒 ショップ

    </button>

    <button id="inventoryButton">

        🎒 インベントリ

    </button>

    <button id="settingButton">

        ⚙️ 設定

    </button>

    <button id="logoutButton">

        🚪 ログアウト

    </button>

</div>

<!-- ===========================
ワールド一覧
=========================== -->

<div id="worldScreen"
     class="screen hidden">

    <h1>

        🌍 My Worlds

    </h1>

    <div id="worldList">

    </div>

    <button id="createWorldButton">

        ＋ ワールド作成

    </button>

    <button id="worldBackButton">

        戻る

    </button>

</div>

<!-- ===========================
ワールド作成
=========================== -->

<div id="createWorldScreen"
     class="screen hidden">

    <h1>

        新しいワールド

    </h1>

    <input
        id="worldName"
        type="text"
        placeholder="ワールド名">

    <input
        id="worldSeed"
        type="text"
        placeholder="シード（空欄で自動）">

    <select id="worldBiome">

        <option value="normal">

            🌱 ノーマル

        </option>

        <option value="forest">

            🌲 森林

        </option>

        <option value="desert">

            🏜 砂漠

        </option>

        <option value="crystal">

            💎 クリスタル

        </option>

    </select>

    <select id="worldDifficulty">

        <option>

            Easy

        </option>

        <option selected>

            Normal

        </option>

        <option>

            Hard

        </option>

    </select>

    <button id="createWorld">

        作成

    </button>

    <button id="cancelWorld">

        キャンセル

    </button>

</div>

<!-- ===========================
ショップ
=========================== -->

<div id="shopScreen"
     class="screen hidden">

    <h1>

        🛒 Crystal Shop

    </h1>

    <p>

        💎

        <span id="shopCoinText">

            100

        </span>

    </p>

    <div id="shopList">

    </div>

    <button id="shopBackButton">

        戻る

    </button>

</div>

<!-- ===========================
設定
=========================== -->

<div id="settingScreen"
     class="screen hidden">

    <h1>

        ⚙️ Settings

    </h1>

    <label>

        ニックネーム

    </label>

    <input
        id="nicknameInput"
        type="text">

    <label>

        アイコン

    </label>

    <div id="iconList">

        <button class="iconButton">😀</button>

        <button class="iconButton">🤖</button>

        <button class="iconButton">👾</button>

        <button class="iconButton">💎</button>

        <button class="iconButton">🌍</button>

    </div>

    <button id="saveProfileButton">

        保存

    </button>

    <button id="settingBackButton">

        戻る

    </button>

</div>

<script src="script.js"></script>

</body>
</html>
