<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitWorld</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login">

    <h1>🌍 BitWorld</h1>

    <p class="subtitle">
        デジタル世界へようこそ
    </p>

    <input
        id="username"
        type="text"
        placeholder="ユーザー名">

    <input
        id="password"
        type="password"
        placeholder="パスワード">

    <button id="loginBtn">
        ログイン
    </button>

    <button id="registerBtn">
        新規アカウント作成
    </button>

    <hr>

    <button class="guest">
        ゲストプレイ
    </button>

</div>
    <div id="register" style="display:none">

<h1>🌱 アカウント作成</h1>

<input id="newUser" placeholder="ユーザー名">

<input id="newPass"
type="password"
placeholder="パスワード">

<button id="createBtn">
アカウント作成
</button>

<button id="backBtn">
戻る
</button>

</div>

<script src="script.js"></script>

</body>
</html>
